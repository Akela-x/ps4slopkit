<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 - Poops Exploit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1 class="main-title">
            <span class="highlight">PS4 WebKit Хост</span>
        </h1>
        <div class="subtitle">Взлом для 12.50 и выше</div>
        <div class="version-badge">ЦЕПОЧКА POOPS</div>
    </header>
    
    <hr class="separator">

    <div id="menu">
        <h2 class="fw-title">⚡ Эксплойт Poops</h2>
        <p class="fw-range">Прошивка <span class="range-highlight">12.50 +</span></p>
        
        <div class="status-bar">
            <span id="state" class="status-text loading">⏳ Ждите...</span>
        </div>

        <!-- السجل مخفي -->
        <div id="out" style="display:none;"></div>

        <footer>
            <p class="credit">Специально для 4PDA Sony PlayStation 4 - Взлом</p>
        </footer>
    </div>
</div>

<script type="module">
    // Импорт эксплойта
    import("./chain_poops.js").catch(function(e) {
        var stateEl = document.getElementById("state");
        stateEl.innerHTML = "❌ Ошибка!";
        stateEl.className = "status-text error";
    });
</script>
</body>
</html>
